function deleteTrip(id){let trip=state.trips.find(x=>x.id===id);if(!trip)return;if(!confirm(`Reise „${trip.name}“ endgültig löschen?\n\nDie bisher notierten vergessenen Gegenstände bleiben als Erfahrung für spätere Reisen erhalten.`))return;state.trips=state.trips.filter(x=>x.id!==id);if(state.active===id)state.active=state.trips[0]?.id||null;save();closeModal();tab='home';render()}

function home(){let t=active(),p=t&&progress(t);return header()+`<div class="panel hero stack"><div class="eyebrow">${t?'AKTUELLE REISE':'WILLKOMMEN'}</div><h2>${t?esc(t.name):'Deine nächste Reise'}</h2><p class="muted">${t?`${p.done} von ${p.total} eingepackt${t.nights?' · '+t.nights+' Übernachtungen':''}`:'Lege eine Reise an und stelle deine Packliste zusammen.'}</p>${t?`<div class="progress"><div style="width:${p.pct}%"></div></div><button class="btn full" data-action="open-trip">Packliste öffnen</button>`:`<button class="btn full" data-action="new-trip">Erste Reise anlegen</button>`}</div><button class="btn full secondary" data-action="new-trip">＋ Neue Reise anlegen</button><div class="spacer"></div><h2>Deine Reisen</h2><div class="spacer"></div><div class="stack">${state.trips.some(x=>!x.archived)?state.trips.filter(x=>!x.archived).map(x=>{let q=progress(x);return `<div class="trip-row"><button class="trip ${x.id===state.active?'active':''}" data-action="select-trip" data-id="${esc(x.id)}"><div class="line"><div><div class="trip-title">${esc(x.name)}</div><div class="muted">${q.done}/${q.total} eingepackt${x.nights?' · '+x.nights+' Nächte':''}</div></div><span class="pill">${x.id===state.active?'Aktiv':'Öffnen'} ›</span></div></button><button class="trip-delete" data-action="delete-trip" data-id="${esc(x.id)}" aria-label="Reise ${esc(x.name)} löschen" title="Reise löschen">✕</button></div><div class="trip-actions"><button data-action="duplicate-trip" data-id="${esc(x.id)}">⧉ Wiederverwenden</button><button data-action="archive-trip" data-id="${esc(x.id)}">Archivieren</button></div>`}).join(''):'<div class="empty">Noch keine Reisen vorhanden.</div>'}</div>${archivedTrips().length?`<details class="panel archive-heading"><summary><strong>Archivierte Reisen (${archivedTrips().length})</strong></summary><div class="stack">${archivedTrips().map(x=>`<div><strong>${esc(x.name)}</strong><div class="hint">${x.items.length} Gegenstände</div><div class="trip-actions"><button data-action="duplicate-trip" data-id="${esc(x.id)}">⧉ Als neue Reise verwenden</button><button data-action="unarchive-trip" data-id="${esc(x.id)}">Wiederherstellen</button><button data-action="delete-trip" data-id="${esc(x.id)}">Endgültig löschen</button></div></div>`).join('')}</div></details>`:''}${t?`<div class="learnpanel"><h3>Nach der Reise</h3><p class="hint">Notiere, was gefehlt hat. Packfolio schlägt dir diese Gegenstände bei der nächsten Reise wieder vor.</p><button class="inline-action" data-action="open-forgotten">＋ Was habe ich vergessen?</button>${(t.forgotten||[]).length?`<p class="hint">Schon notiert: ${t.forgotten.map(f=>esc(f.name)).join(' · ')}</p>`:''}</div>`:''}`}
function packing(){let t=active();if(!t)return header('AKTUELLE PACKLISTE')+`<div class="panel empty">Noch keine Reise ausgewählt.<div class="spacer"></div><button class="btn" data-action="new-trip">Reise anlegen</button></div>`;let p=progress(t),groups=t.items.reduce((a,i)=>((a[i.category||'Sonstiges']??=[]).push(i),a),{});let cats=[...new Set([...order,...Object.keys(groups)])].filter(c=>groups[c]?.length);return `<div class="top packtop"><div class="pack-actions"><button class="back-mini" data-action="go-home" aria-label="Zur Reiseübersicht">← Reisen</button></div><button class="round" data-action="pack-menu" aria-label="Weitere Optionen">⋯</button></div><h1 class="logo" style="margin-bottom:16px">${esc(t.name)}</h1><div class="packstatus"><span>${p.done} von ${p.total} eingepackt</span><span>${p.pct}%</span><div class="progress"><div style="width:${p.pct}%"></div></div></div>${(t.suggestions||[]).length?`<details class="panel" id="pf-suggestions" ${suggestionsOpen?'open':''}><summary><strong>Passende Ergänzungen</strong> <span class="hint">(optional)</span></summary><p class="hint">Tippe auf einen Vorschlag zum Hinzufügen; ein zweiter Tipp entfernt ihn wieder. Bereits enthaltene Gegenstände sind markiert.</p><div class="builder-tags">${t.suggestions.map(n=>{let added=t.items.some(i=>norm(canonicalName(i.name))===norm(canonicalName(n)));return `<button class="builder-tag" data-action="add-property-suggestion" data-name="${esc(n)}" aria-pressed="${added}">${added?'✓':'＋'} ${esc(n)}</button>`}).join('')}</div></details>`:''}<div class="category-stack">${cats.map(c=>{let arr=groups[c],count=arr.filter(i=>i.done).length,open=expanded.has(c);return `<section class="cat" style="${pfCatStyles(c,Math.round(count/arr.length*100))}"><div class="pf-cat-heading"><button class="cathead" data-action="toggle-cat" data-cat="${esc(c)}" aria-expanded="${open}"><span class="cat-title">${esc(c)}</span><span class="cat-count">${count}/${arr.length}</span><span class="pf-cat-track" aria-hidden="true"><span style="width:${Math.round(count/arr.length*100)}%"></span></span></button><input class="pf-cat-check" type="checkbox" data-action="check-category" data-cat="${esc(c)}" aria-label="Alle Gegenstände in ${esc(c)} ${count===arr.length?'zurücksetzen':'als gepackt markieren'}" ${count===arr.length?'checked':''}><button class="pf-cat-chevron" data-action="toggle-cat" data-cat="${esc(c)}" aria-label="${esc(c)} ${open?'einklappen':'ausklappen'}">${open?'⌃':'⌄'}</button></div>${open?`<div class="catbody">${arr.map(i=>`<div class="item ${i.done?'done':''}"><button class="item-delete" data-action="remove-item" data-id="${esc(i.id)}" aria-label="${esc(i.name)} von der Packliste entfernen" title="Entfernen">✕</button><div class="itemmain"><div class="itemname">${esc(i.name)}</div>${i.conditional?'<div class="itemmeta">Situativ</div>':''}</div><button class="quantity-pill" data-action="edit-qty" data-id="${esc(i.id)}" aria-label="Menge von ${esc(i.name)} ändern">${i.qty}×</button><input class="check" type="checkbox" data-action="check" data-id="${esc(i.id)}" aria-label="${esc(i.name)} eingepackt" ${i.done?'checked':''}></div>`).join('')}<div class="cat-add-row"><input class="cat-add-input" data-category="${esc(c)}" placeholder="＋ Gegenstand eingeben" aria-label="Gegenstand in ${esc(c)} hinzufügen"><button class="cat-add-plus" data-action="cat-picker" data-cat="${esc(c)}" aria-label="Lexikon für ${esc(c)} öffnen">＋</button></div><div class="cat-suggest" data-suggestions="${esc(c)}"></div></div>`:''}</section>`}).join('')}</div>${p.total===0?'<div class="panel empty">Noch keine Gegenstände. Über „Gegenstand ohne Kategorie hinzufügen“ kannst du starten.</div>':''}<div class="learnpanel review-compact"><button class="review-trigger" data-action="open-forgotten"><span>✎ &nbsp;Reiseerfahrungen</span><span>›</span></button>${(t.forgotten||[]).length?`<p class="hint">Notiert: ${t.forgotten.map(f=>esc(f.name)).join(' · ')}</p>`:''}</div>`}
function lexicon(){let items=allLexicon().filter(x=>x.kind!=='task'&&(showArchived||x.status!=='archiviert')&&(!lexQuery||norm(x.name).includes(norm(lexQuery))));return `<button class="back-mini" data-action="go-home">← Reisen</button><div class="spacer"></div>`+header('GEGENSTANDSLEXIKON')+`<div class="panel"><h2>Deine Gegenstände</h2><p class="muted">Aus deinen Packlisten und ergänzenden Anlass-Kategorien. Seltene Gegenstände bleiben situativ und werden nur auf Wunsch hinzugefügt.</p><div class="spacer"></div><input class="field" id="lex-search" placeholder="Gegenstand suchen …" value="${esc(lexQuery)}"><div class="spacer"></div><label class="hint"><input type="checkbox" id="archived" ${showArchived?'checked':''}> Archivierte Gegenstände anzeigen</label><div class="searchlist">${items.slice(0,120).map(x=>`<button class="searchresult" data-action="lex-add" data-name="${esc(x.name)}"><div class="line"><div><strong>${esc(x.name)}</strong><div class="hint">${esc(x.category)}</div></div><span>＋</span></div></button>`).join('')}</div>${items.length>120?'<div class="hint">Suche verwenden, um weitere Einträge zu finden.</div>':''}</div>`}

function renderModal(){let body='';if(modal==='cat-color'){const cat=window.pfEditingCategory||'Sonstiges';body=`<h2>Kategoriefarbe</h2><p class="muted">${esc(cat)} · Die Farbe gilt für alle Reisen. Die Packliste bleibt unverändert.</p><div class="pf-color-options">${PF_CAT_COLORS.map(color=>`<button class="pf-color-choice" style="--swatch:${color}" data-action="set-cat-color" data-cat="${esc(cat)}" data-color="${color}" aria-label="Farbe ${color} auswählen" aria-pressed="${pfCatColor(cat)===color}"></button>`).join('')}</div>`}else if(modal==='pdf-options'){body=`<h2>Packliste als PDF</h2><p class="muted">A4-Hochformat mit Kategorien als Abschnitten. Der aktuelle Abhakstatus und die Mengen werden übernommen.</p><div class="spacer"></div><button class="btn full" data-action="pdf-create" data-columns="3">PDF mit 3 Spalten erstellen</button><div class="spacer"></div><button class="btn full secondary" data-action="pdf-create" data-columns="2">PDF mit 2 Spalten erstellen</button>`}else if(modal==='new'){body=`<h2>Neue Reise</h2><form id="new-form"><label for="trip-name">Name der Reise</label><input id="trip-name" class="field" required placeholder="z. B. Marokko 2027"><label for="trip-nights">Übernachtungen (optional)</label><input id="trip-nights" class="field" type="number" min="0" max="180" placeholder="z. B. 5"><label>Ausgangspunkt</label><div class="builder-tabs"><label><input type="radio" name="builder-source" value="templates" checked> Vorlagen</label><label><input type="radio" name="builder-source" value="past"> Frühere Reise</label><label><input type="radio" name="builder-source" value="empty"> Neu beginnen</label></div><div id="builder-templates"><details class="builder-group"><summary>Vorlagen auswählen (auch mehrere)</summary><p class="hint">Neun persönliche Vorlagen aus deinen Packlisten. Weitere Reisearten über Eigenschaften ergänzen.</p>${BASE.templates.map((t,i)=>`<label class="templatechoice"><input type="checkbox" name="template" value="${i}"> ${esc(t.name)}</label>`).join('')}</details></div><div id="builder-past-group" hidden><label for="builder-past">Frühere oder archivierte Reise</label><select class="field" id="builder-past">${state.trips.map(t=>`<option value="${esc(t.id)}">${esc(t.name)}${t.archived?' (Archiv)':''}</option>`).join('')}</select><p class="hint">Mengen bleiben erhalten, Häkchen werden zurückgesetzt. Die alte Reise bleibt unverändert.</p></div><details class="builder-group" open><summary>Eigenschaften ergänzen</summary><div class="builder-tags">${PF_PROPERTIES.map(p=>`<label class="builder-tag"><input type="checkbox" data-property="${p.id}"> ${esc(p.label)}</label>`).join('')}</div></details>${forgottenSuggestions().length?`<details class="builder-group"><summary>Aus Vergessenem lernen</summary>${forgottenSuggestions().map(x=>`<label class="templatechoice"><input type="checkbox" name="remembered" value="${esc(x.name)}"> ${esc(x.name)} (${x.count}×)</label>`).join('')}</details>`:''}<div id="builder-preview" class="builder-tip" aria-live="polite"></div><div class="spacer"></div><button class="btn full" type="submit">Reise anlegen</button></form>`}else if(modal==='edit-trip'){let t=active();body=t?`<h2>Reise anpassen</h2><form id="edit-trip-form"><label for="edit-trip-name">Titel der Reise</label><input class="field" id="edit-trip-name" required value="${esc(t.name)}"><label for="edit-trip-start">Beginn (optional)</label><input class="field" type="date" id="edit-trip-start" value="${esc(t.startDate||'')}"><label for="edit-trip-end">Ende (optional)</label><input class="field" type="date" id="edit-trip-end" value="${esc(t.endDate||'')}"><label for="edit-trip-nights">Übernachtungen</label><input class="field" type="number" min="0" max="180" id="edit-trip-nights" value="${t.nights??''}"><label for="edit-trip-destination">Reiseziel (optional)</label><input class="field" id="edit-trip-destination" value="${esc(t.destination||'')}"><details class="builder-group" open><summary>Reiseeigenschaften ergänzen</summary><div class="builder-tags">${PF_PROPERTIES.map(p=>`<label class="builder-tag"><input type="checkbox" name="edit-property" value="${p.id}" ${(t.properties||[]).includes(p.id)?'checked':''}> ${esc(p.label)}</label>`).join('')}</div><p class="hint">Neue Eigenschaften ergänzen passende Gegenstände. Entfernte Eigenschaften löschen keine bestehenden Einträge.</p></details><details class="builder-group"><summary>Weitere Vorlagen ergänzen</summary>${BASE.templates.map((x,i)=>`<label class="templatechoice"><input type="checkbox" name="edit-template" value="${i}"> ${esc(x.name)}</label>`).join('')}</details><button class="btn full" type="submit">Änderungen übernehmen</button></form>`:''}else if(modal==='settings'){body=`<h2>Einstellungen & Daten</h2><p class="hint">Version <strong>1.6.3</strong></p><div class="spacer"></div><button class="btn full secondary" data-action="open-lexicon">Lexikon verwalten</button><p class="muted">Alle Daten liegen derzeit nur in diesem Safari-Browser. Sichere sie regelmäßig als JSON.</p><div class="spacer"></div><button class="btn full" data-action="export">Daten exportieren</button><div class="spacer"></div><label>Datensicherung importieren</label><input class="field" id="import-file" type="file" accept=".json,application/json"><div class="spacer"></div><div class="notice">Der Import ersetzt den aktuellen Stand. Vorher exportieren!</div><div class="spacer"></div><button class="btn full secondary" data-action="rename">Aktuelle Reise umbenennen</button><div class="spacer"></div><button class="btn full ghost" data-action="delete-trip">Aktuelle Reise löschen</button><div class="spacer"></div><p class="hint">Mikrofonaufnahme ist vorerst zurückgestellt. Du kannst weiterhin die Diktiertaste der iPhone-Tastatur verwenden.</p>`}else if(modal==='forgotten'){let t=active();body=`<h2>Was habe ich vergessen?</h2><p class="muted">${t?`Rückblick auf „${esc(t.name)}“`:'Reiserückblick'}. Diese Einträge zählen <strong>nicht</strong> als ungepackte Gegenstände und verändern den Packfortschritt nicht. Bei künftigen Reisen bekommst du sie als Vorschläge.</p><form id="forgotten-form"><label for="forgotten-text">Das hat gefehlt</label><textarea id="forgotten-text" class="field" rows="3" required placeholder="z. B. USB-Netzteil und Sonnenbrille"></textarea><p class="hint">Mehrere Gegenstände kannst du mit „und“ oder Komma trennen.</p><div class="spacer"></div><button class="btn full" type="submit">Erfahrung speichern</button></form>${(t?.forgotten||[]).length?`<h3 class="recent-title">Bei dieser Reise notiert</h3><div class="review-list">${t.forgotten.map(x=>`<div class="review-entry"><span>${esc(x.name)}</span><button class="inline-action danger" data-action="forget-undo" data-id="${esc(x.id)}" aria-label="Eintrag entfernen">Entfernen</button></div>`).join('')}</div>`:''}` }else if(modal==='add'){body=`<h2>Gegenstände hinzufügen</h2><p class="hint">Suchen, auswählen oder mehrere Gegenstände mit „und“ eingeben.</p><div class="addbar"><input id="quick" class="field" autocomplete="off" placeholder="z. B. 3 T-Shirts und Zahnbürste"><button class="btn" data-action="quick-add">Hinzufügen</button></div><div id="add-results" class="searchlist"></div><h3 class="recent-title">Zuletzt verwendet</h3><div class="recent-list">${state.recent.slice(0,12).map(n=>`<button class="recent-line" data-action="add-recent" data-name="${esc(n)}"><span>${esc(n)}</span><span class="recent-plus">＋</span></button>`).join('')||'<p class="hint">Noch keine zuletzt verwendeten Gegenstände.</p>'}</div>`}else if(modal==='cat-picker'){let c=window.selectedCategory||'Sonstiges';body=`<div class="category-picker-heading"><h2>${esc(c)}</h2><button class="picker-close" data-action="close-modal" aria-label="Schließen">×</button></div><input id="category-search" class="field" autocomplete="off" placeholder="Gegenstand suchen …"><div id="category-results" class="category-picker-list"></div>`}else if(modal==='pack-menu'){body=`<h2>Packliste</h2><button class="btn full secondary" data-action="edit-trip">✎ Reise anpassen</button><div class="spacer"></div><button class="btn full secondary" data-action="open-add">＋ Gegenstand ohne Kategorie</button><div class="spacer"></div><button class="btn full" data-action="pdf-options">▤ Packliste als PDF</button><div class="spacer"></div><button class="btn full secondary" data-action="settings">Einstellungen & Daten</button><div class="spacer"></div><button class="btn full ghost" data-action="go-home-close">Zur Reiseübersicht</button>`}else if(modal==='new-item'){body=`<h2>Neuen Gegenstand hinzufügen</h2><p class="muted">${esc(window.newItemPending?.name||'')}</p><p class="hint">Kategorie: ${esc(window.newItemPending?.category||'Sonstiges')}</p><label class="templatechoice"><input type="checkbox" id="save-new-lex" checked> Auch dauerhaft im Lexikon speichern</label><div class="spacer"></div><button class="btn full" data-action="confirm-new-item">Zur Packliste hinzufügen</button>`}else if(modal==='qty-editor'){let x=active()?.items.find(i=>i.id===window.qtyItemId);body=x?`<h2>Menge ändern</h2><p class="muted">${esc(x.name)}</p><div class="qty-control"><button data-action="qty-step" data-delta="-1" aria-label="Weniger">−</button><input id="qty-value" type="number" min="1" max="999" inputmode="numeric" value="${x.qty}" aria-label="Menge"><button data-action="qty-step" data-delta="1" aria-label="Mehr">＋</button></div><button class="btn full" data-action="qty-save">Übernehmen</button>`:''}else if(modal==='picker'){body=`<h2>Aus Lexikon hinzufügen</h2><input id="picker-search" class="field" placeholder="Gegenstand suchen …"><div id="picker-results" class="searchlist"></div>`}else if(modal==='preview'){body=`<h2>Einträge übernehmen</h2><div class="hint">Bitte erkannte Gegenstände prüfen. Bestehende Einträge werden nicht verdoppelt.</div><div id="preview-list"></div><div class="spacer"></div><button class="btn full" data-action="confirm-add">Einträge hinzufügen</button>`}$('#modal').innerHTML=`<div class="overlay" id="overlay"><div class="sheet ${modal==='cat-picker'?'category-sheet':''}">${modal==='cat-picker'?'':'<div class="line"><span class="eyebrow">PACKFOLIO</span><button class="round" data-action="close-modal">Schließen ×</button></div><div class="spacer"></div>'}${body}</div></div>`;if(modal==='new')builderPreview();if(modal==='cat-picker')categoryResults('');if(modal==='picker')pickerResults('');if(modal==='add')addResults('');if(modal==='preview')$('#preview-list').innerHTML=(window.pending||[]).map((x,i)=>`<div class="templatechoice"><input type="checkbox" data-pick="${i}" checked><span>${esc(x.name)} · ${x.qty}×</span></div>`).join('')}
function categoryResults(q){
 let c=window.selectedCategory||'Sonstiges',t=active(),search=norm(q);
 let seen=new Set();
 let items=allLexicon().filter(x=>x.kind!=='task'&&x.status!=='archiviert'&&x.category===c&&(!search||norm(x.name).includes(search)||norm(canonicalName(x.name)).includes(search)))
 .sort((a,b)=>{let ar=state.recent.indexOf(a.name),br=state.recent.indexOf(b.name);return (ar<0?999:ar)-(br<0?999:br)||a.name.localeCompare(b.name,'de')})
 .filter(x=>{let key=norm(canonicalName(x.name));if(seen.has(key))return false;seen.add(key);return true});
 let el=$('#category-results');if(!el)return;
 el.innerHTML=items.map(x=>{let name=canonicalName(x.name),known=knownItem(name),exists=t?.items.some(i=>i.lexiconId===known?.id||norm(canonicalName(i.name))===norm(name));return `<div class="category-picker-row"><span>${esc(name)}</span><button class="${exists?'is-added':''}" data-action="cat-add-existing" data-name="${esc(name)}" aria-label="${esc(name)} ${exists?'entfernen':'hinzufügen'}" aria-pressed="${!!exists}">${exists?'✓':'＋'}</button></div>`}).join('')||'<p class="hint">Keine passenden Gegenstände. Du kannst sie direkt in der Kategorie eintippen.</p>';
}

function addCategoryText(el){let raw=el.value.trim(),cat=el.dataset.category;if(!raw)return;let parsed=parseInput(raw),t=active();if(!t)return;el.value='';let unknown=parsed.filter(x=>!knownItem(x.name));let known=parsed.filter(x=>knownItem(x.name));if(known.length)addItems(known,cat);if(unknown.length===1){window.newItemPending={...unknown[0],category:cat};openModal('new-item')}else if(unknown.length){for(let x of unknown){state.customLexicon??=[];if(confirm('„'+x.name+'“ auch im Lexikon speichern?'))state.customLexicon.push({id:'custom-'+Date.now()+Math.random(),name:x.name,category:cat,kind:'item',status:'standard'})}addItems(unknown,cat)}}

function pfPdfText(s){return String(s??'').replace(/[\u2013\u2014]/g,'-').replace(/[\u2018\u2019]/g,"'").replace(/[\u201c\u201d]/g,'"').replace(/\u2026/g,'...').replace(/\u00a0/g,' ').replace(/[\u0100-\uffff]/g,c=>({'\u20ac':'EUR','\u2022':'-','\u2713':'x'}[c]||'?'))}
function pfPdfBytes(s){let out=[];for(const c of s){let k=c.charCodeAt(0);out.push(k<=255?k:63)}return out}
function pfPdfEscape(s){return pfPdfText(s).replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)')}
function pfPdfWidth(s,size){let wide=/[MW@%&QO]/,narrow=/[ilI1.,:;!| ']/;return [...pfPdfText(s)].reduce((a,c)=>a+(wide.test(c)?0.79:narrow.test(c)?0.28:0.52)*size,0)}

 // Keep the backdrop covering the layout viewport and anchor the opaque
 // sheet above the keyboard. Never resize/move the backdrop itself.
 const keyboardInset=Math.max(0,Math.round(layoutHeight-visibleTop-visibleHeight));
 const keyboardOpen=keyboardInset>90;
 const sheetHeight=Math.max(160,Math.min(visibleHeight-4,keyboardOpen?visibleHeight-4:Math.round(visibleHeight*.76)));
 overlay.style.removeProperty('top');
 overlay.style.removeProperty('height');
 overlay.style.removeProperty('bottom');
 overlay.style.setProperty('--pf-keyboard-bottom',keyboardInset+'px');
 overlay.style.setProperty('--pf-picker-height',sheetHeight+'px');
}
let pickerViewportFrame=0;
function schedulePickerViewport(){
 if(pickerViewportFrame)cancelAnimationFrame(pickerViewportFrame);
 pickerViewportFrame=requestAnimationFrame(()=>{pickerViewportFrame=0;updatePickerViewport()});
}

let stickyFrame=0;
function refreshStickyHeaders(){
 stickyFrame=0;
 for(const h of document.querySelectorAll('.cathead')){
  const rect=h.getBoundingClientRect();const section=h.closest('.cat')?.getBoundingClientRect();
  h.classList.toggle('is-stuck',rect.top<=1&&section&&section.bottom>rect.height+2&&window.scrollY>5);
 }
}


if(window.visualViewport){visualViewport.addEventListener('resize',schedulePickerViewport);visualViewport.addEventListener('scroll',schedulePickerViewport)}
document.addEventListener('focusin',e=>{if(e.target?.id==='category-search'){schedulePickerViewport();requestAnimationFrame(schedulePickerViewport)}});
document.addEventListener('focusout',e=>{if(e.target?.id==='category-search'){schedulePickerViewport();requestAnimationFrame(schedulePickerViewport)}});
window.addEventListener('resize',schedulePickerViewport);
pfMigrate157();render();updatePickerViewport();refreshStickyHeaders();
