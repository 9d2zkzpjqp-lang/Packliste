<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wochenendtrip – Packliste 🎉</title>
<style>
:root{
  --bg:#f7f7fb; --card:#fff; --text:#202124; --muted:#70737a;
  --accent:#6c5ce7; --accent2:#00b894; --line:#e9e9ef;
  --done:#eefaf6; --shadow:0 8px 28px rgba(28,31,38,.08);
}
*{box-sizing:border-box}
body{margin:0;font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
.wrap{max-width:760px;margin:auto;padding:22px 16px 70px}
.hero{background:linear-gradient(135deg,#fff,#f2efff);border:1px solid #e8e2ff;border-radius:24px;padding:22px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero h1{margin:0;font-size:30px}.hero p{margin:6px 0 0;color:var(--muted)}
.progressbox{display:flex;align-items:center;gap:14px;margin-top:18px}
.bar{height:12px;background:#e9e7f4;border-radius:999px;overflow:hidden;flex:1}.fill{height:100%;width:0;background:var(--accent);transition:.25s}
.percent{font-weight:800;min-width:46px;text-align:right}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}
button{font:inherit;border:0;border-radius:13px;padding:11px 14px;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.07);cursor:pointer}
button.primary{background:var(--accent);color:#fff}
section{margin-top:18px;background:var(--card);border-radius:20px;padding:16px;box-shadow:var(--shadow)}
section h2{font-size:19px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center}
.catprog{font-size:13px;color:var(--muted);font-weight:500}
.item{display:flex;align-items:center;gap:12px;padding:10px 2px;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.item input{width:23px;height:23px;accent-color:var(--accent)}
.item label{flex:1;cursor:pointer}.item.done label{text-decoration:line-through;color:#999}
.qty{font-size:13px;color:var(--muted);background:#f3f3f7;padding:3px 8px;border-radius:999px}
.footer{text-align:center;color:var(--muted);font-size:13px;margin-top:22px}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:10}
.piece{position:absolute;top:-20px;width:10px;height:16px;border-radius:2px;animation:fall 1.8s linear forwards}
@keyframes fall{to{transform:translate(var(--drift),110vh) rotate(720deg);opacity:.9}}
.toast{position:fixed;left:50%;bottom:25px;transform:translateX(-50%) translateY(20px);background:#202124;color:#fff;padding:12px 17px;border-radius:999px;opacity:0;pointer-events:none;transition:.25s;z-index:20}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:500px){.hero h1{font-size:25px}.wrap{padding:12px 10px 60px}section{border-radius:17px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <h1>Wochenendtrip 🎒✨</h1>
    <p>Freitag los. Sonntag zurück. Nichts Wichtiges vergessen.</p>
    <div class="progressbox"><div class="bar"><div class="fill" id="fill"></div></div><div class="percent" id="percent">0 %</div></div>
  </div>

  <div class="controls">
    <button class="primary" id="party">🎉 Motivation!</button>
    <button id="openOnly">Nur Offenes</button>
    <button id="reset">↺ Zurücksetzen</button>
  </div>

  <div id="list"></div>
  <div class="footer">Pro-Tipp: Das letzte Häkchen hat sich Konfetti verdient. 😄</div>
</div>
<div class="confetti" id="confetti"></div>
<div class="toast" id="toast">Sehr gut. Der Koffer gewinnt. 🎉</div>

<script>
const groups = [
["⭐ Meine Sachen",[
["Handy",1],["Portemonnaie",1],["Personalausweis",1],["Hausschlüssel",1],
["Brille",1],["AirPods",1],["iPad",1],["E-Book-Reader",1],["Powerbank",1],
["Ladegerät / Netzteil",1],["Ladekabel",1],["Charging Pad",1],["Persönliche Medikamente",1]
]],
["👕 Kleidung",[
["T-Shirts",2],["Unterwäsche",2],["Socken",2],["Hose",1],["Pullover",1],
["Schlafsachen",1],["Jacke",1],["Bequeme Schuhe",1]
]],
["🧴 Körperpflege",[
["Zahnbürste",1],["Zahnpasta",1],["Deo",1],["Duschgel",1],["Shampoo",1],
["Haargel",1],["Parfum",1]
]],
["🕶️ Je nach Wetter & Plan",[
["Sonnenbrille",1],["Badehose",1],["Regenschirm",1],["Buff",1]
]],
["🚆 Für unterwegs",[
["Tickets / Buchung",1],["Kopfhörer geladen",1],["Wasserflasche",1],
["Kleiner Tagesrucksack",1],["Block + Kuli",1]
]]
];

const root=document.getElementById("list");
let openOnly=false;
groups.forEach((g,gi)=>{
 const s=document.createElement("section"); s.dataset.group=gi;
 const h=document.createElement("h2");
 h.innerHTML=`<span>${g[0]}</span><span class="catprog"></span>`; s.appendChild(h);
 g[1].forEach((it,ii)=>{
  const row=document.createElement("div"); row.className="item";
  const id=`i-${gi}-${ii}`;
  row.innerHTML=`<input type="checkbox" id="${id}"><label for="${id}">${it[0]}</label>${it[1]>1?`<span class="qty">× ${it[1]}</span>`:""}`;
  s.appendChild(row);
  row.querySelector("input").addEventListener("change",()=>{row.classList.toggle("done",row.querySelector("input").checked); update();});
 });
 root.appendChild(s);
});
function update(){
 const all=[...document.querySelectorAll('.item input')], done=all.filter(x=>x.checked);
 const p=Math.round(done.length/all.length*100);
 document.getElementById("fill").style.width=p+"%"; document.getElementById("percent").textContent=p+" %";
 document.querySelectorAll("section").forEach(s=>{
   const a=[...s.querySelectorAll(".item input")],d=a.filter(x=>x.checked);
   s.querySelector(".catprog").textContent=`${d.length}/${a.length}`;
 });
 document.querySelectorAll(".item").forEach(r=>r.style.display=(openOnly && r.querySelector("input").checked)?"none":"flex");
 if(done.length===all.length){burst(90); toast("Alles gepackt. Abfahrt! 🥳");}
}
function burst(n=45){
 const c=document.getElementById("confetti"), colors=["#6c5ce7","#00b894","#fdcb6e","#e17055","#0984e3","#e84393"];
 for(let i=0;i<n;i++){const p=document.createElement("i");p.className="piece";p.style.left=Math.random()*100+"%";p.style.background=colors[i%colors.length];p.style.setProperty("--drift",(Math.random()*180-90)+"px");p.style.animationDelay=Math.random()*.25+"s";p.style.animationDuration=(1.4+Math.random()*1.3)+"s";c.appendChild(p);setTimeout(()=>p.remove(),3000)}
}
function toast(t){const el=document.getElementById("toast");el.textContent=t;el.classList.add("show");setTimeout(()=>el.classList.remove("show"),1800)}
document.getElementById("party").onclick=()=>{burst();toast("Weiter so – Wochenende in Sicht! ✨")};
document.getElementById("openOnly").onclick=e=>{openOnly=!openOnly;e.target.textContent=openOnly?"Alle anzeigen":"Nur Offenes";update()};
document.getElementById("reset").onclick=()=>{document.querySelectorAll("input").forEach(x=>x.checked=false);document.querySelectorAll(".item").forEach(x=>x.classList.remove("done"));update()};
update();
</script>
</body>
</html>
