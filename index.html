function pfEffectiveLexicon(){const overrides=state.lexiconOverrides||{};return [...BASE.lexicon,...(state.customLexicon||[])].map(x=>({...x,...(overrides[x.id]||{})}));}
function allLexicon(){let extra=[...state.forgotten,...state.trips.flatMap(t=>t.items||[])].filter(x=>x.name).map(x=>({name:x.name,category:x.category||category(x.name),kind:'item',status:'situativ'}));let res=[],seen=new Set();for(const i of [...pfEffectiveLexicon(),...extra]){if(i.kind==='task'||PF_RETIRED_157.has(i.name)||(PF_RETIRED.has(norm(i.name))&&i.status!=='archiviert'))continue;let known=knownItem(i.name);let key=known?.id||norm(i.name);if(seen.has(key))continue;seen.add(key);res.push(i)}return res}

function recordForgotten(raw){let t=active();if(!t)return;let parts=parseInput(raw);if(!parts.length)return;let at=new Date().toISOString();for(let p of parts){let name=p.name.trim();if(!name)continue;let rec={id:crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random()),name,category:category(name),tripId:t.id,tripName:t.name,at};t.forgotten.push(rec);state.forgotten.push(rec);touch(name)}save();closeModal();render()}
function deleteTrip(id){let trip=state.trips.find(x=>x.id===id);if(!trip)return;if(!confirm(`Reise „${trip.name}“ endgültig löschen?\n\nDie bisher notierten vergessenen Gegenstände bleiben als Erfahrung für spätere Reisen erhalten.`))return;state.trips=state.trips.filter(x=>x.id!==id);if(state.active===id)state.active=state.trips[0]?.id||null;save();closeModal();tab='home';render()}

function home(){let t=active(),p=t&&progress(t);return header()+`<div class="panel hero stack"><div class="eyebrow">${t?'AKTUELLE REISE':'WILLKOMMEN'}</div><h2>${t?esc(t.name):'Deine nächste Reise'}</h2><p class="muted">${t?`${p.done} von ${p.total} eingepackt${t.nights?' · '+t.nights+' Übernachtungen':''}`:'Lege eine Reise an und stelle deine Packliste zusammen.'}</p>${t?`<div class="progress"><div style="width:${p.pct}%"></div></div><button class="btn full" data-action="open-trip">Packliste öffnen</button>`:`<button class="btn full" data-action="new-trip">Erste Reise anlegen</button>`}</div><button class="btn full secondary" data-action="new-trip">＋ Neue Reise anlegen</button><div class="spacer"></div><h2>Deine Reisen</h2><div class="spacer"></div><div class="stack">${state.trips.some(x=>!x.archived)?state.trips.filter(x=>!x.archived).map(x=>{let q=progress(x);return `<div class="trip-row"><button class="trip ${x.id===state.active?'active':''}" data-action="select-trip" data-id="${esc(x.id)}"><div class="line"><div><div class="trip-title">${esc(x.name)}</div><div class="muted">${q.done}/${q.total} eingepackt${x.nights?' · '+x.nights+' Nächte':''}</div></div><span class="pill">${x.id===state.active?'Aktiv':'Öffnen'} ›</span></div></button><button class="trip-delete" data-action="delete-trip" data-id="${esc(x.id)}" aria-label="Reise ${esc(x.name)} löschen" title="Reise löschen">✕</button></div><div class="trip-actions"><button data-action="duplicate-trip" data-id="${esc(x.id)}">⧉ Wiederverwenden</button><button data-action="archive-trip" data-id="${esc(x.id)}">Archivieren</button></div>`}).join(''):'<div class="empty">Noch keine Reisen vorhanden.</div>'}</div>${archivedTrips().length?`<details class="panel archive-heading"><summary><strong>Archivierte Reisen (${archivedTrips().length})</strong></summary><div class="stack">${archivedTrips().map(x=>`<div><strong>${esc(x.name)}</strong><div class="hint">${x.items.length} Gegenstände</div><div class="trip-actions"><button data-action="duplicate-trip" data-id="${esc(x.id)}">⧉ Als neue Reise verwenden</button><button data-action="unarchive-trip" data-id="${esc(x.id)}">Wiederherstellen</button><button data-action="delete-trip" data-id="${esc(x.id)}">Endgültig löschen</button></div></div>`).join('')}</div></details>`:''}${t?`<div class="learnpanel"><h3>Nach der Reise</h3><p class="hint">Notiere, was gefehlt hat. Packfolio schlägt dir diese Gegenstände bei der nächsten Reise wieder vor.</p><button class="inline-action" data-action="open-forgotten">＋ Was habe ich vergessen?</button>${(t.forgotten||[]).length?`<p class="hint">Schon notiert: ${t.forgotten.map(f=>esc(f.name)).join(' · ')}</p>`:''}</div>`:''}`}
function pfDaysToDeparture(iso){
 if(!/^\d{4}-\d{2}-\d{2}$/.test(iso||''))return null;
 const [y,m,d]=iso.split('-').map(Number),date=new Date(y,m-1,d);
 if(date.getFullYear()!==y||date.getMonth()!==m-1||date.getDate()!==d)return null;
 const now=new Date(),today=Date.UTC(now.getFullYear(),now.getMonth(),now.getDate());
 return Math.round((Date.UTC(y,m-1,d)-today)/86400000);
}
function pfDepartureCard(t){
 const days=pfDaysToDeparture(t.startDate);
 if(days===null)return '';
 const date=new Date(t.startDate+'T12:00:00');
 const formatted=new Intl.DateTimeFormat('de-DE',{day:'numeric',month:'long',year:'numeric'}).format(date);
 return `<div class="pf-overview-stat"><span class="pf-overview-number">${days>0?days:days===0?'Heute':'✓'}</span><span class="pf-overview-label">${days>1?'Tage bis zur Abreise':days===1?'Tag bis zur Abreise':days===0?'Abreise heute':'Abreise liegt zurück'}</span><span class="pf-overview-date">${esc(formatted)}</span></div>`;
}
function packing(){let t=active();if(!t)return header('AKTUELLE PACKLISTE')+`<div class="panel empty">Noch keine Reise ausgewählt.<div class="spacer"></div><button class="btn" data-action="new-trip">Reise anlegen</button></div>`;let p=progress(t),groups=t.items.reduce((a,i)=>((a[i.category||'Sonstiges']??=[]).push(i),a),{});let cats=[...new Set([...order,...Object.keys(groups),...(t.extraCategories||[])])].filter(c=>groups[c]?.length||(t.extraCategories||[]).includes(c));return `<div class="top packtop"><div class="pack-actions"><button class="back-mini" data-action="go-home" aria-label="Zur Reiseübersicht">← Reisen</button></div><button class="pf-icon-button pf-menu-button" data-action="pack-menu" aria-label="Weitere Optionen" title="Weitere Optionen"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false"><circle cx="5" cy="12" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="19" cy="12" r="1.9"/></svg></button></div><div class="pf-trip-overview"><h1 class="logo">${esc(t.name)}</h1><div class="pf-overview-stats" style="grid-template-columns:${pfDaysToDeparture(t.startDate)===null?'1fr':'repeat(2,minmax(0,1fr))'}">${pfDepartureCard(t)}<div class="pf-overview-stat"><span class="pf-overview-number">${p.total-p.done}</span><span class="pf-overview-label">noch zu packen</span><span class="pf-overview-date">${p.done} von ${p.total} eingepackt</span></div></div><div class="pf-overview-foot"><span>Packfortschritt</span><span>${p.pct}%</span></div><div class="progress"><div style="width:${p.pct}%"></div></div></div>${(t.suggestions||[]).length?`<details class="panel pf-suggestions-panel" id="pf-suggestions" ${suggestionsOpen?'open':''}><summary><strong>Passende Ergänzungen</strong> <span class="hint">(optional)</span></summary><p class="hint">Tippe auf einen Vorschlag zum Hinzufügen; ein zweiter Tipp entfernt ihn wieder. Bereits enthaltene Gegenstände sind markiert.</p><div class="builder-tags">${t.suggestions.map(n=>{let added=t.items.some(i=>norm(canonicalName(i.name))===norm(canonicalName(n)));return `<button class="builder-tag" data-action="add-property-suggestion" data-name="${esc(n)}" aria-pressed="${added}">${added?'✓':'＋'} ${esc(n)}</button>`}).join('')}</div></details>`:''}<div class="category-stack">${cats.map(c=>{let arr=groups[c]||[],count=arr.filter(i=>i.done).length,open=expanded.has(c);return `<section class="cat" style="${pfCatStyles(c,Math.round(count/Math.max(1,arr.length)*100))}"><div class="pf-cat-heading"><button class="cathead" data-action="toggle-cat" data-cat="${esc(c)}" aria-expanded="${open}"><span class="pf-cat-titlewrap">${pfCategoryIcon(c)}<span class="cat-title">${esc(c)}</span></span><span class="cat-count">${count}/${arr.length}</span><span class="pf-cat-track" aria-hidden="true"><span style="width:${Math.round(count/Math.max(1,arr.length)*100)}%"></span></span></button><input class="pf-cat-check" type="checkbox" data-action="check-category" data-cat="${esc(c)}" aria-label="Alle Gegenstände in ${esc(c)} ${arr.length&&count===arr.length?'zurücksetzen':'als gepackt markieren'}" ${arr.length&&count===arr.length?'checked':''} ${!arr.length?'disabled':''}><button class="pf-cat-chevron" data-action="toggle-cat" data-cat="${esc(c)}" aria-label="${esc(c)} ${open?'einklappen':'ausklappen'}"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="${open?'M5 15l7-7 7 7':'M5 9l7 7 7-7'}" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>${open?`<div class="catbody">${arr.map(i=>`<div class="item ${i.done?'done':''}"><button class="item-delete" data-action="remove-item" data-id="${esc(i.id)}" aria-label="${esc(i.name)} von der Packliste entfernen" title="Entfernen">✕</button><div class="itemmain"><div class="itemname">${esc(i.name)}</div>${i.conditional?'<div class="itemmeta">Situativ</div>':''}</div><button class="quantity-pill" data-action="edit-qty" data-id="${esc(i.id)}" aria-label="Menge von ${esc(i.name)} ändern">${i.qty}×</button><input class="check" type="checkbox" data-action="check" data-id="${esc(i.id)}" aria-label="${esc(i.name)} eingepackt" ${i.done?'checked':''}></div>`).join('')}<div class="cat-add-row"><input class="cat-add-input" data-category="${esc(c)}" placeholder="＋ Gegenstand eingeben" aria-label="Gegenstand in ${esc(c)} hinzufügen"><button class="cat-add-plus" data-action="cat-picker" data-cat="${esc(c)}" aria-label="Lexikon für ${esc(c)} öffnen">＋</button></div><div class="cat-suggest" data-suggestions="${esc(c)}"></div></div>`:''}</section>`}).join('')}</div>${p.total===0?'<div class="panel empty">Noch keine Gegenstände. Über „Gegenstand hinzufügen“ kannst du starten.</div>':''}<div class="learnpanel review-compact"><button class="review-trigger" data-action="open-forgotten"><span>✎ &nbsp;Reiseerfahrungen</span><span>›</span></button>${(t.forgotten||[]).length?`<p class="hint">Notiert: ${t.forgotten.map(f=>esc(f.name)).join(' · ')}</p>`:''}</div>`}
function lexicon(){let items=allLexicon().filter(x=>x.kind!=='task'&&(showArchived||x.status!=='archiviert')&&(!lexQuery||norm(x.name).includes(norm(lexQuery))||norm(x.category).includes(norm(lexQuery)))).sort((a,b)=>a.name.localeCompare(b.name,'de'));return `<button class="back-mini" data-action="go-home">← Reisen</button><div class="spacer"></div><div class="pf-library-head"><span class="eyebrow">MEINE BIBLIOTHEK</span><h1>Mein Lexikon</h1><p class="muted">Gegenstände zentral verwalten. Bestehende Reisen bleiben unverändert.</p></div><div class="pf-lex-toolbar"><input class="field" id="lex-search" placeholder="Gegenstand oder Kategorie suchen …" value="${esc(lexQuery)}"><button class="btn" data-action="lex-new">＋ Neu</button></div><label class="hint pf-archive-toggle"><input type="checkbox" id="archived" ${showArchived?'checked':''}> Archivierte anzeigen</label><div class="pf-lex-count">${items.length} Gegenstände</div><div class="pf-lex-list">${items.map(x=>`<div class="pf-lex-row"><button class="pf-lex-name" data-action="lex-edit" data-id="${esc(x.id||'')}" data-name="${esc(x.name)}"><strong>${esc(x.name)}</strong><small>${x.status==='archiviert'?'Archiviert · ':''}Standard: ${Math.max(1,Number(x.defaultQty)||1)}×</small></button><button class="pf-lex-category" style="${pfCatStyles(x.category||'Sonstiges',0)}" data-action="lex-category" data-id="${esc(x.id||'')}" data-name="${esc(x.name)}" aria-label="Kategorie von ${esc(x.name)} ändern">${esc(x.category||'Sonstiges')} ▾</button><button class="pf-lex-arrow" data-action="lex-edit" data-id="${esc(x.id||'')}" data-name="${esc(x.name)}" aria-label="${esc(x.name)} bearbeiten"><svg class="pf-lucide" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button></div>`).join('')||'<div class="panel empty">Keine passenden Gegenstände.</div>'}</div>`}
function pfLexFind(id,name){return pfEffectiveLexicon().find(x=>id&&x.id===id)||allLexicon().find(x=>norm(x.name)===norm(name))}
function pfLexSave(id,oldName,data){const base=BASE.lexicon.find(x=>x.id===id);if(base){state.lexiconOverrides??={};state.lexiconOverrides[id]={...(state.lexiconOverrides[id]||{}),...data}}else{state.customLexicon??=[];let existing=state.customLexicon.find(x=>x.id===id);if(existing)Object.assign(existing,data);else state.customLexicon.push({id:'custom-'+freshId(),kind:'item',status:'standard',...data})}save()}

function renderPackingBehindModal(){if(tab==='packing')$('#app').innerHTML=packing()}
function render(){$('#app').innerHTML=tab==='home'?home():tab==='packing'?packing():lexicon();if(modal)renderModal()}
function openModal(type){modal=type;renderModal();requestAnimationFrame(updatePickerViewport)};function closeModal(){modal=null;$('#modal').innerHTML='';updatePickerViewport()}
function renderModal(){let body='';if(modal==='lex-edit'){let x=pfLexFind(window.pfLexId,window.pfLexName);body=`<h2>${x?'Gegenstand bearbeiten':'Neuer Gegenstand'}</h2><form id="pf-lex-form"><label for="pf-lex-name">Bezeichnung</label><input class="field" id="pf-lex-name" required value="${esc(x?.name||'')}" maxlength="120"><label for="pf-lex-cat">Kategorie</label><select class="field" id="pf-lex-cat">${[...new Set([...order,...allLexicon().map(i=>i.category).filter(Boolean),'Sonstiges'])].map(c=>`<option value="${esc(c)}" ${c===x?.category?'selected':''}>${esc(c)}</option>`).join('')}</select><label for="pf-lex-qty">Standardmenge</label><input class="field" id="pf-lex-qty" type="number" min="1" max="999" value="${Math.max(1,Number(x?.defaultQty)||1)}"><div class="spacer"></div><button class="btn full" type="submit">Speichern</button></form>${x?`<div class="spacer"></div><button class="btn full ghost" data-action="lex-archive">${x.status==='archiviert'?'Wieder aktivieren':'Archivieren'}</button>`:''}<p class="hint">Änderungen gelten für zukünftige Packlisten. Bestehende Reisen werden nicht umbenannt oder verschoben.</p>`}else if(modal==='lex-category'){let x=pfLexFind(window.pfLexId,window.pfLexName);body=`<h2>Kategorie ändern</h2><p class="muted">${esc(x?.name||'')}</p><div class="pf-category-choices">${[...new Set([...order,...allLexicon().map(i=>i.category).filter(Boolean),'Sonstiges'])].map(c=>`<button class="pf-lex-category pf-cat-option" style="${pfCatStyles(c,0)}" data-action="lex-set-category" data-cat="${esc(c)}">${esc(c)} ${c===x?.category?'✓':''}</button>`).join('')}</div>`}
if(modal==='cat-color'){const cat=window.pfEditingCategory||'Sonstiges';body=`<h2>Kategoriefarbe</h2><p class="muted">${esc(cat)} · Die Farbe gilt für alle Reisen. Die Packliste bleibt unverändert.</p><div class="pf-color-options">${PF_CAT_COLORS.map(color=>`<button class="pf-color-choice" style="--swatch:${color}" data-action="set-cat-color" data-cat="${esc(cat)}" data-color="${color}" aria-label="Farbe ${color} auswählen" aria-pressed="${pfCatColor(cat)===color}"></button>`).join('')}</div>`}else if(modal==='pdf-options'){body=`<h2>Packliste als PDF</h2><p class="muted">A4-Hochformat mit Kategorien als Abschnitten. Der aktuelle Abhakstatus und die Mengen werden übernommen.</p><div class="spacer"></div><button class="btn full" data-action="pdf-create" data-columns="3">PDF mit 3 Spalten erstellen</button><div class="spacer"></div><button class="btn full secondary" data-action="pdf-create" data-columns="2">PDF mit 2 Spalten erstellen</button>`}else if(modal==='new'){body=`<h2>Neue Reise</h2><form id="new-form"><label for="trip-name">Name der Reise</label><input id="trip-name" class="field" required placeholder="z. B. Marokko 2027"><label for="trip-nights">Übernachtungen (optional)</label><input id="trip-nights" class="field" type="number" min="0" max="180" placeholder="z. B. 5"><label>Ausgangspunkt</label><div class="builder-tabs"><label><input type="radio" name="builder-source" value="templates" checked> Vorlagen</label><label><input type="radio" name="builder-source" value="past"> Frühere Reise</label><label><input type="radio" name="builder-source" value="empty"> Neu beginnen</label></div><div id="builder-templates"><details class="builder-group"><summary>Vorlagen auswählen (auch mehrere)</summary><p class="hint">Neun persönliche Vorlagen aus deinen Packlisten. Weitere Reisearten über Eigenschaften ergänzen.</p>${BASE.templates.map((t,i)=>`<label class="templatechoice"><input type="checkbox" name="template" value="${i}"> ${esc(t.name)}</label>`).join('')}</details></div><div id="builder-past-group" hidden><label for="builder-past">Frühere oder archivierte Reise</label><select class="field" id="builder-past">${state.trips.map(t=>`<option value="${esc(t.id)}">${esc(t.name)}${t.archived?' (Archiv)':''}</option>`).join('')}</select><p class="hint">Mengen bleiben erhalten, Häkchen werden zurückgesetzt. Die alte Reise bleibt unverändert.</p></div><details class="builder-group" open><summary>Eigenschaften ergänzen</summary><div class="builder-tags">${PF_PROPERTIES.map(p=>`<label class="builder-tag"><input type="checkbox" data-property="${p.id}"> ${esc(p.label)}</label>`).join('')}</div></details>${forgottenSuggestions().length?`<details class="builder-group"><summary>Aus Vergessenem lernen</summary>${forgottenSuggestions().map(x=>`<label class="templatechoice"><input type="checkbox" name="remembered" value="${esc(x.name)}"> ${esc(x.name)} (${x.count}×)</label>`).join('')}</details>`:''}<div id="builder-preview" class="builder-tip" aria-live="polite"></div><div class="spacer"></div><button class="btn full" type="submit">Reise anlegen</button></form>`}else if(modal==='edit-trip'){let t=active();body=t?`<h2>Reise anpassen</h2><form id="edit-trip-form"><label for="edit-trip-name">Titel der Reise</label><input class="field" id="edit-trip-name" required value="${esc(t.name)}"><label for="edit-trip-start">Beginn (optional)</label><input class="field" type="date" id="edit-trip-start" value="${esc(t.startDate||'')}"><label for="edit-trip-end">Ende (optional)</label><input class="field" type="date" id="edit-trip-end" value="${esc(t.endDate||'')}"><label for="edit-trip-nights">Übernachtungen</label><input class="field" type="number" min="0" max="180" id="edit-trip-nights" value="${t.nights??''}"><label for="edit-trip-destination">Reiseziel (optional)</label><input class="field" id="edit-trip-destination" value="${esc(t.destination||'')}"><details class="builder-group" open><summary>Reiseeigenschaften ergänzen</summary><div class="builder-tags">${PF_PROPERTIES.map(p=>`<label class="builder-tag"><input type="checkbox" name="edit-property" value="${p.id}" ${(t.properties||[]).includes(p.id)?'checked':''}> ${esc(p.label)}</label>`).join('')}</div><p class="hint">Neue Eigenschaften ergänzen passende Gegenstände. Entfernte Eigenschaften löschen keine bestehenden Einträge.</p></details><details class="builder-group"><summary>Weitere Vorlagen ergänzen</summary>${BASE.templates.map((x,i)=>`<label class="templatechoice"><input type="checkbox" name="edit-template" value="${i}"> ${esc(x.name)}</label>`).join('')}</details><button class="btn full" type="submit">Änderungen übernehmen</button></form>`:''}else if(modal==='settings'){body=`<h2>Einstellungen & Daten</h2><p class="hint">Version <strong>1.7.4 (Kategorieillustrationen)</strong></p><div class="spacer"></div><button class="btn full secondary" data-action="open-lexicon">Meine Bibliothek · Mein Lexikon</button><p class="muted">Alle Daten liegen derzeit nur in diesem Safari-Browser. Sichere sie regelmäßig als JSON.</p><div class="spacer"></div><button class="btn full" data-action="export">Daten exportieren</button><div class="spacer"></div><label>Datensicherung importieren</label><input class="field" id="import-file" type="file" accept=".json,application/json"><div class="spacer"></div><div class="notice">Der Import ersetzt den aktuellen Stand. Vorher exportieren!</div><div class="spacer"></div><button class="btn full secondary" data-action="rename">Aktuelle Reise umbenennen</button><div class="spacer"></div><button class="btn full ghost" data-action="delete-trip">Aktuelle Reise löschen</button><div class="spacer"></div><p class="hint">Mikrofonaufnahme ist vorerst zurückgestellt. Du kannst weiterhin die Diktiertaste der iPhone-Tastatur verwenden.</p>`}else if(modal==='forgotten'){let t=active();body=`<h2>Was habe ich vergessen?</h2><p class="muted">${t?`Rückblick auf „${esc(t.name)}“`:'Reiserückblick'}. Diese Einträge zählen <strong>nicht</strong> als ungepackte <button data-action="qty-step" data-delta="-1" aria-label="Weniger">−</button><input id="qty-value" type="number" min="1" max="999" inputmode="numeric" value="${x.qty}" aria-label="Menge"><button data-action="qty-step" data-delta="1" aria-label="Mehr">＋</button></div><button class="btn full" data-action="qty-save">Übernehmen</button>`:''}else if(modal==='picker'){body=`<h2>Aus Lexikon hinzufügen</h2><input id="picker-search" class="field" placeholder="Gegenstand suchen …"><div id="picker-results" class="searchlist"></div>`}else if(modal==='preview'){body=`<h2>Einträge übernehmen</h2><div class="hint">Bitte erkannte Gegenstände prüfen. Bestehende Einträge werden nicht verdoppelt.</div><div id="preview-list"></div><div class="spacer"></div><button class="btn full" data-action="confirm-add">Einträge hinzufügen</button>`}$('#modal').innerHTML=`<div class="overlay" id="overlay"><div class="sheet ${modal==='cat-picker'?'category-sheet':''}">${modal==='cat-picker'?'':'<div class="line"><span class="eyebrow">PACKFOLIO</span><button class="pf-icon-button pf-close-button" data-action="close-modal" aria-label="Schließen" title="Schließen"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false"><path d="M5 5l14 14M19 5L5 19"/></svg></button></div><div class="spacer"></div>'}${body}</div></div>`;if(modal==='new')builderPreview();if(modal==='cat-picker')categoryResults('');if(modal==='picker')pickerResults('');if(modal==='add')addResults('');if(modal==='preview')$('#preview-list').innerHTML=(window.pending||[]).map((x,i)=>`<div class="templatechoice"><input type="checkbox" data-pick="${i}" checked><span>${esc(x.name)} · ${x.qty}×</span></div>`).join('')}
function categoryResults(q){
 let c=window.selectedCategory||'Sonstiges',t=active(),search=norm(q);
 let seen=new Set();
 let items=allLexicon().filter(x=>x.kind!=='task'&&x.status!=='archiviert'&&x.category===c&&(!search||norm(x.name).includes(search)||norm(canonicalName(x.name)).includes(search)))
 .sort((a,b)=>{let ar=state.recent.indexOf(a.name),br=state.recent.indexOf(b.name);return (ar<0?999:ar)-(br<0?999:br)||a.name.localeCompare(b.name,'de')})
 .filter(x=>{let key=norm(canonicalName(x.name));if(seen.has(key))return false;seen.add(key);return true});
 let el=$('#category-results');if(!el)return;
 el.innerHTML=items.map(x=>{let name=canonicalName(x.name),known=knownItem(name),exists=t?.items.some(i=>i.lexiconId===known?.id||norm(canonicalName(i.name))===norm(name));return `<div class="category-picker-row"><span>${esc(name)}</span><button class="${exists?'is-added':''}" data-action="cat-add-existing" data-name="${esc(name)}" aria-label="${esc(name)} ${exists?'entfernen':'hinzufügen'}" aria-pressed="${!!exists}">${exists?'✓':'＋'}</button></div>`}).join('')||'<p class="hint">Keine passenden Gegenstände. Du kannst sie direkt in der Kategorie eintippen.</p>';
}

function addCategoryText(el){let raw=el.value.trim(),cat=el.dataset.category;if(!raw)return;let parsed=parseInput(raw),t=active();if(!t)return;el.value='';let unknown=parsed.filter(x=>!knownItem(x.name));let known=parsed.filter(x=>knownItem(x.name));if(known.length)addItems(known,cat);if(unknown.length===1){window.newItemPending={...unknown[0],category:cat};openModal('new-item')}else if(unknown.length){for(let x of unknown){state.customLexicon??=[];if(confirm('„'+x.name+'“ auch im Lexikon speichern?'))state.customLexicon.push({id:'custom-'+Date.now()+Math.random(),name:x.name,category:cat,kind:'item',status:'standard'})}addItems(unknown,cat)}}
function categorySuggestions(el){let c=el.dataset.category,q=el.value.trim(),out=[...document.querySelectorAll('[data-suggestions]')].find(x=>x.dataset.suggestions===c);if(!out)return;if(!q){out.innerHTML='';return}let t=active();let matches=allLexicon().filter(x=>x.status!=='archiviert'&&x.kind!=='task'&&x.category===c&&norm(x.name).includes(norm(q))&&norm(x.name)===norm(canonicalName(x.name))&&!t?.items.some(i=>i.lexiconId===x.id||norm(i.name)===norm(x.name))).slice(0,5);out.innerHTML=matches.map(x=>`<button data-action="cat-suggestion" data-name="${esc(x.name)}" data-cat="${esc(c)}"><span>${esc(x.name)}</span><span>＋</span></button>`).join('')}
function addResults(q){let el=$('#add-results');if(!el)return;let v=q.trim();if(!v){el.innerHTML='';return}let items=allLexicon().filter(x=>x.kind!=='task'&&x.status!=='archiviert'&&norm(x.name).includes(norm(v))).slice(0,12);el.innerHTML=items.map(x=>`<button class="searchresult" data-action="add-suggestion" data-name="${esc(x.name)}"><span>${esc(x.name)}</span><span class="recent-plus">＋</span></button>`).join('')}
function pickerResults(q){let items=allLexicon().filter(x=>x.kind!=='task'&&x.status!=='archiviert'&&norm(x.name).includes(norm(q))).slice(0,35);$('#picker-results').innerHTML=items.map(x=>`<button class="searchresult" data-action="picker-add" data-name="${esc(x.name)}">＋ ${esc(x.name)} <span class="hint">${esc(x.category)}</span></button>`).join('')}
const numbers={ein:1,eine:1,einen:1,eins:1,zwei:2,drei:3,vier:4,fünf:5,sechs:6,sieben:7,acht:8,neun:9,zehn:10};
function parseInput(s){let protectedNames=['Schnorchel und Maske','Notizbuch und Kugelschreiber','Boxershorts und Socken'];let tmp=s;protectedNames.forEach((n,i)=>{tmp=tmp.replaceAll(new RegExp(n,'gi'),`__PROTECTED${i}__`)});return tmp.split(/\s+und\s+|[,;\n]+/i).map(x=>{protectedNames.forEach((n,i)=>x=x.replaceAll(`__PROTECTED${i}__`,n));x=x.trim();let m=x.match(/^(\d+|ein(?:e|en|s)?|zwei|drei|vier|fünf|sechs|sieben|acht|neun|zehn)\s+(?:paar\s+)?(.+)$/i);return {name:m?m[2].trim():x,qty:m?(Number(m[1])||numbers[m[1].toLowerCase()]||1):1}}).filter(x=>x.name)}
function addItems(items,forcedCategory){let t=active();if(!t){alert('Bitte zuerst eine Reise anlegen.');return}for(let x of items){let known=knownItem(x.name);if(known?.status==='archiviert'){alert('Dieser Gegenstand ist archiviert: '+x.name);continue}let name=known?.name||x.name;let old=t.items.find(i=>known?.id?(i.lexiconId===known.id||knownItem(i.name)?.id===known.id):norm(i.name)===norm(name));if(old){old.qty=Math.max(old.qty,x.qty)}else t.items.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random()),lexiconId:known?.id||null,name,qty:x.qty,done:false,category:forcedCategory||known?.category||category(name)});touch(name);expanded.add(forcedCategory||known?.category||category(name))}save();if(modal==='cat-picker')renderPackingBehindModal();else render()}

function addFromText(){let input=$('#quick');let s=input?.value.trim();if(!s)return;window.pending=parseInput(s);if(window.pending.length===1){closeModal();addItems(window.pending);return}openModal('preview')}
// Dependency-free A4 PDF layout. Uses PDF standard fonts and WinAnsi text encoding.
function pfPdfText(s){return String(s??'').replace(/[\u2013\u2014]/g,'-').replace(/[\u2018\u2019]/g,"'").replace(/[\u201c\u201d]/g,'"').replace(/\u2026/g,'...').replace(/\u00a0/g,' ').replace(/[\u0100-\uffff]/g,c=>({'\u20ac':'EUR','\u2022':'-','\u2713':'x'}[c]||'?'))}
function pfPdfBytes(s){let out=[];for(const c of s){let k=c.charCodeAt(0);out.push(k<=255?k:63)}return out}
function pfPdfEscape(s){return pfPdfText(s).replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)')}
function pfPdfWidth(s,size){let wide=/[MW@%&QO]/,narrow=/[ilI1.,:;!| ']/;return [...pfPdfText(s)].reduce((a,c)=>a+(wide.test(c)?0.79:narrow.test(c)?0.28:0.52)*size,0)}
function pfPdfWrap(s,width,size){let words=pfPdfText(s).split(/\s+/).filter(Boolean),lines=[],cur='';for(let word of words){while(pfPdfWidth(word,size)>width&&word.length>1){let n=1;while(n<word.length&&pfPdfWidth(word.slice(0,n+1),size)<=width)n++;let part=word.slice(0,n);if(cur){lines.push(cur);cur=''}lines.push(part);word=word.slice(n)}let next=cur?cur+' '+word:word;if(pfPdfWidth(next,size)>width&&cur){lines.push(cur);cur=word}else cur=next}if(cur)lines.push(cur);return lines.length?lines:['']}
function pfPdfCreate(trip,columns){
 const W=595.28,H=841.89,M=39,CW=W-2*M,G=13,cols=columns===2?2:3,colW=(CW-G*(cols-1))/cols;
 const pages=[];let commands=[],y=0,pageNo=0;
 const rect=(x,top,w,h,fill)=>commands.push(`${fill?'0.93 0.95 0.95 rg':'0.45 0.52 0.52 RG'} ${x.toFixed(2)} ${(H-top-h).toFixed(2)} ${w.toFixed(2)} ${h.toFixed(2)} re ${fill?'f':'S'}`);
 const text=(s,x,top,size=9,bold=false)=>commands.push(`BT /${bold?'F2':'F1'} ${size} Tf 0.12 0.20 0.22 rg 1 0 0 1 ${x.toFixed(2)} ${(H-top-size).toFixed(2)} Tm (${pfPdfEscape(s)}) Tj ET`);
 const line=(x1,t1,x2,t2)=>commands.push(`0.79 0.82 0.82 RG 0.5 w ${x1.toFixed(2)} ${(H-t1).toFixed(2)} m ${x2.toFixed(2)} ${(H-t2).toFixed(2)} l S`);
 const strike=(x1,top,x2)=>commands.push(`0.42 0.48 0.49 RG 0.8 w ${x1.toFixed(2)} ${(H-top).toFixed(2)} m ${x2.toFixed(2)} ${(H-top).toFixed(2)} l S`);
 const footer=()=>{line(M,H-42,W-M,H-42);text('Packfolio  |  '+trip.name,M,H-35,7);text('Seite '+pageNo,W-M-36,H-35,7)};
 const newPage=()=>{if(pageNo){footer();pages.push(commands.join('\n'))}pageNo++;commands=[];y=43;if(pageNo===1){text('PACKFOLIO  /  PACKLISTE',M,y,8,true);y+=17;for(let l of pfPdfWrap(trip.name,CW,17)){text(l,M,y,17,true);y+=22}let meta=[trip.destination,trip.startDate&&trip.endDate?trip.startDate+' bis '+trip.endDate:'',`${trip.items.length} Gegenstaende`].filter(Boolean).join('  |  ');text(meta,M,y,8);y+=22;line(M,y,W-M,y);y+=14}else{text(trip.name,M,y,11,true);y+=26}};
 newPage();
 const groups=new Map();for(const item of trip.items||[]){let cat=item.category||'Sonstiges';if(!groups.has(cat))groups.set(cat,[]);groups.get(cat).push(item)}
 const cats=[...new Set([...order,...groups.keys()])].filter(c=>groups.has(c));
 const bottom=H-57;
 for(const cat of cats){const items=groups.get(cat);let idx=0,continued=false;
  while(idx<items.length){const headerH=26;
   if(y+headerH+27>bottom)newPage();
   rect(M,y,CW,19,true);text(cat+(continued?' (Fortsetzung)':''),M+7,y+3,10,true);y+=26;
   const avail=bottom-y;
   const rowInfo=items.slice(idx).map(item=>{const qty=Math.max(1,Number(item.qty)||1);const packed=Number(item.packedQty??item.packedCount??(item.done?qty:0));const label=item.name+(qty>1?' ('+(packed>0&&!item.done?Math.min(qty,packed)+'/'+qty:qty+'x')+')':'');const lines=pfPdfWrap(label,colW-21,8.3);return {item,lines,h:Math.max(19,lines.length*11+6)}});
   // Balance items in columns; use full available height only when necessary.
   let best=null;
   for(let n=1;n<=rowInfo.length;n++){
    const chunk=rowInfo.slice(0,n);let target=chunk.reduce((a,r)=>a+r.h,0)/cols;
    let buckets=[[]],heights=[0];for(const r of chunk){let k=buckets.length-1;if(heights[k]+r.h>Math.max(target,28)&&buckets.length<cols&&buckets[k].length){buckets.push([]);heights.push(0);k++}buckets[k].push(r);heights[k]+=r.h}
    if(Math.max(...heights)<=avail)best={n,buckets,heights};else break;

// Keep category search results visible above the iOS Safari software keyboard.
function updatePickerViewport(){
 if(modal!=='cat-picker')return;
 const overlay=document.getElementById('overlay');
 const sheet=overlay?.querySelector('.category-sheet');
 if(!overlay||!sheet)return;
 const vv=window.visualViewport;
 const layoutHeight=window.innerHeight;
 const visibleHeight=Math.max(180,Math.round(vv?.height||layoutHeight));
 const visibleTop=Math.max(0,Math.round(vv?.offsetTop||0));
 // iOS Safari changes the visual viewport when its keyboard appears.
 // Keep the backdrop covering the layout viewport and anchor the opaque
 // sheet above the keyboard. Never resize/move the backdrop itself.
 const keyboardInset=Math.max(0,Math.round(layoutHeight-visibleTop-visibleHeight));
 const keyboardOpen=keyboardInset>90;
 const sheetHeight=Math.max(160,Math.min(visibleHeight-4,keyboardOpen?visibleHeight-4:Math.round(visibleHeight*.76)));
 overlay.style.removeProperty('top');
 overlay.style.removeProperty('height');
 overlay.style.removeProperty('bottom');
 overlay.style.setProperty('--pf-keyboard-bottom',keyboardInset+'px');
 overlay.style.setProperty('--pf-picker-height',sheetHeight+'px');
}
let pickerViewportFrame=0;
function schedulePickerViewport(){
 if(pickerViewportFrame)cancelAnimationFrame(pickerViewportFrame);
 pickerViewportFrame=requestAnimationFrame(()=>{pickerViewportFrame=0;updatePickerViewport()});
}
