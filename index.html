function builderPreview(){let root=document.getElementById('builder-preview');if(!root)return;let source=document.querySelector('input[name="builder-source"]:checked')?.value||'templates';let base=source==='past'?state.trips.find(t=>t.id===document.getElementById('builder-past')?.value):null;let chosen=[...document.querySelectorAll('input[name="template"]:checked')].map(x=>BASE.templates[Number(x.value)]);let properties=PF_PROPERTIES.filter(x=>document.querySelector('input[data-property="'+x.id+'"]')?.checked);let items=makeItems([...(base?.items||[]).map(x=>({name:x.name,quantity:x.qty})),...(source==='templates'?chosen.flatMap(t=>t.items):[]),...properties.flatMap(p=>p.items.map(name=>({name,quantity:1})))]);let suggestions=[...new Set(properties.flatMap(p=>p.suggest))].filter(name=>!items.some(i=>norm(canonicalName(i.name))===norm(canonicalName(name))));root.innerHTML='<strong>'+items.length+' Gegenstände vorausgewählt</strong>'+(suggestions.length?'<div class="hint">Passende Extras (nicht automatisch hinzugefügt): '+suggestions.map(esc).join(' · ')+'</div>':'');document.getElementById('builder-templates').hidden=source!=='templates';document.getElementById('builder-past-group').hidden=source!=='past'}

function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){alert('Speichern fehlgeschlagen. Bitte Daten exportieren.')}}
function active(){return state.trips.find(t=>t.id===state.active)||null}
function itemName(x){return x.name||x.label||''}
const PF_CATEGORY_FIXES={
 'chronisch':['Dauermedikamente','Reiseapotheke & Gesundheit'],
 'dauermedikamente':['Dauermedikamente','Reiseapotheke & Gesundheit'],
 'durchfall':['Durchfallmittel','Reiseapotheke & Gesundheit'],
 'kopfschmerzen':['Schmerz- und Fiebermittel','Reiseapotheke & Gesundheit'],
 'flip-flops':['Flip-Flops / Badeschlappen','Kleidung & Schuhe'],
 'flip-flops / badeschlappen':['Flip-Flops / Badeschlappen','Kleidung & Schuhe'],
 'zip-fleece':['Fleece / Zip-Fleece','Kleidung & Schuhe'],
 'pulli':['Pullover / Hoodie','Kleidung & Schuhe'],
 'haargel':['Haargel / Haarstyling','Körperpflege & Hygiene'],
 'reisehandtuch':['Handtuch / Reisehandtuch','Reisezubehör'],
 'wasserdichter beutel':['Wasserfeste Hülle / Zip-Beutel','Reisezubehör']
};
function pfFix(name){return PF_CATEGORY_FIXES[norm(name)]||null}
function pfEnsureMedicine(t){if(!t.items.some(i=>norm(i.name)==='dauermedikamente'||norm(i.name)==='chronisch'))t.items.push({id:freshId(),name:'Dauermedikamente',qty:1,done:false,category:'Reiseapotheke & Gesundheit'});}
function pfMigrate(){let changed=false;for(const x of BASE.lexicon){let fix=pfFix(x.name);if(fix&&(x.name!==fix[0]||x.category!==fix[1])){x.category=fix[1];changed=true;}}
 for(const x of state.customLexicon||[]){let fix=pfFix(x.name);if(fix){x.category=fix[1];if(norm(x.name)==='chronisch')x.name='Dauermedikamente';changed=true}}
 for(const t of state.trips){for(const i of t.items){let fix=pfFix(i.name);if(fix){if(i.category!==fix[1]){i.category=fix[1];changed=true}if(norm(i.name)==='chronisch'){i.name='Dauermedikamente';changed=true}}else {let known=BASE.lexicon.find(x=>norm(x.name)===norm(i.name));if(known&&i.category!==known.category){i.category=known.category;changed=true}}}}if(changed)save();}
function category(name){let fix=pfFix(name);if(fix)return fix[1];let x=[...BASE.lexicon,...(state.customLexicon||[])].find(x=>norm(x.name)===norm(name));if(!x&&aliases[norm(name)])x=BASE.lexicon.find(i=>i.name===aliases[norm(name)]);return x?.category||(/medikament|wund|sodbrennen|erkältung|prellung|pflaster/i.test(name)?'Reiseapotheke & Gesundheit':/hose|shirt|schuh|jacke|socken|pullover|hemd|schlafzeug|loafer|buff/i.test(name)?'Kleidung & Schuhe':/schlüssel|portemonnaie|notizbuch/i.test(name)?'Dokumente & Geld':'Sonstiges')}
const order=['Kleidung & Schuhe','Körperpflege & Hygiene','Technik','Dokumente & Geld','Reiseapotheke & Gesundheit','Reisezubehör','Sport & Freizeit','Fahrrad & Outdoor','Kinder & Familie','Abreiseaufgaben','Sonstiges'];
const PF_CANONICAL={'kartenspiele / reisespiele':'Kartenspiele'};
function canonicalName(name){return PF_CANONICAL[norm(name)]||name}
function knownItem(name){if(norm(name)==='dauermedikamente')return {id:'pf-permanent-meds',name:'Dauermedikamente',category:'Reiseapotheke & Gesundheit',status:'standard',kind:'item'};let n=norm(canonicalName(name));return [...BASE.lexicon,...(state.customLexicon||[])].find(x=>norm(x.name)===n||Array.isArray(x.aliases)&&x.aliases.some(a=>norm(a)===n))||null}
function makeItems(names){names=[...names,{name:'Dauermedikamente',quantity:1}];let map=new Map();for(let a of names){let original=itemName(a);if(!original)continue;let known=knownItem(original);if(known?.status==='archiviert'||/reiseföhn|tiptoi|windeln|töpfchen/i.test(original))continue;let name=known?.name||original;let key=known?.id||norm(name);let n=Number(a.quantity);let q=Number.isFinite(n)&&n>0?n:1;if(map.has(key)){map.get(key).qty=Math.max(map.get(key).qty,q);continue}map.set(key,{id:crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random()),lexiconId:known?.id||null,name,qty:q,done:false,category:known?.category||category(name),conditional:(a.conditions||[]).length>0})}return [...map.values()]}

function touch(name){state.recent=[name,...state.recent.filter(n=>norm(n)!==norm(name))].slice(0,30)}
function header(label='DEINE REISEN'){return `<header class="top"><div><div class="eyebrow">${label}</div><h1 class="logo">Packfolio</h1></div><button class="round" data-action="settings" aria-label="Einstellungen">⚙</button></header>`}
// Fortschritt ausschließlich anhand aktuell vorhandener Listeneinträge.
function progress(t){let items=Array.isArray(t?.items)?t.items:[];let total=items.length,done=items.filter(i=>i.done===true).length;return {total,done,pct:total?Math.round(done/total*100):0}}
function forgottenSuggestions(){let map=new Map();for(const f of state.forgotten){if(!f.name)continue;let k=norm(f.name);if(!k)continue;let a=map.get(k);if(a){a.count++;if(f.at>a.lastAt)a.lastAt=f.at}else map.set(k,{name:f.name,count:1,lastAt:f.at||''})}return [...map.values()].sort((a,b)=>b.count-a.count||b.lastAt.localeCompare(a.lastAt)).slice(0,20)}
function allLexicon(){let extra=[...state.forgotten,...state.trips.flatMap(t=>t.items||[])].filter(x=>x.name).map(x=>({name:x.name,category:x.category||category(x.name),kind:'item',status:'situativ'}));let res=[],seen=new Set();for(const i of [...BASE.lexicon,...(state.customLexicon||[]),...extra]){if(i.kind==='task')continue;let known=knownItem(i.name);let key=known?.id||norm(i.name);if(seen.has(key))continue;seen.add(key);res.push(i)}return res}

function recordForgotten(raw){let t=active();if(!t)return;let parts=parseInput(raw);if(!parts.length)return;let at=new Date().toISOString();for(let p of parts){let name=p.name.trim();if(!name)continue;let rec={id:crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random()),name,category:category(name),tripId:t.id,tripName:t.name,at};t.forgotten.push(rec);state.forgotten.push(rec);touch(name)}save();closeModal();render()}
function deleteTrip(id){let trip=state.trips.find(x=>x.id===id);if(!trip)return;if(!confirm(`Reise „${trip.name}“ endgültig löschen?\n\nDie bisher notierten vergessenen Gegenstände bleiben als Erfahrung für spätere Reisen erhalten.`))return;state.trips=state.trips.filter(x=>x.id!==id);if(state.active===id)state.active=state.trips[0]?.id||null;save();closeModal();tab='home';render()}

function home(){let t=active(),p=t&&progress(t);return header()+`<div class="panel hero stack"><div class="eyebrow">${t?'AKTUELLE REISE':'WILLKOMMEN'}</div><h2>${t?esc(t.name):'Deine nächste Reise'}</h2><p class="muted">${t?`${p.done} von ${p.total} eingepackt${t.nights?' · '+t.nights+' Übernachtungen':''}`:'Lege eine Reise an und stelle deine Packliste zusammen.'}</p>${t?`<div class="progress"><div style="width:${p.pct}%"></div></div><button class="btn full" data-action="open-trip">Packliste öffnen</button>`:`<button class="btn full" data-action="new-trip">Erste Reise anlegen</button>`}</div><button class="btn full secondary" data-action="new-trip">＋ Neue Reise anlegen</button><div class="spacer"></div><h2>Deine Reisen</h2><div class="spacer"></div><div class="stack">${state.trips.some(x=>!x.archived)?state.trips.filter(x=>!x.archived).map(x=>{let q=progress(x);return `<div class="trip-row"><button class="trip ${x.id===state.active?'active':''}" data-action="select-trip" data-id="${esc(x.id)}"><div class="line"><div><div class="trip-title">${esc(x.name)}</div><div class="muted">${q.done}/${q.total} eingepackt${x.nights?' · '+x.nights+' Nächte':''}</div></div><span class="pill">${x.id===state.active?'Aktiv':'Öffnen'} ›</span></div></button><button class="trip-delete" data-action="delete-trip" data-id="${esc(x.id)}" aria-label="Reise ${esc(x.name)} löschen" title="Reise löschen">✕</button></div><div class="trip-actions"><button data-action="duplicate-trip" data-id="${esc(x.id)}">⧉ Wiederverwenden</button><button data-action="archive-trip" data-id="${esc(x.id)}">Archivieren</button></div>`}).join(''):'<div class="empty">Noch keine Reisen vorhanden.</div>'}</div>${archivedTrips().length?`<details class="panel archive-heading"><summary><strong>Archivierte Reisen (${archivedTrips().length})</strong></summary><div class="stack">${archivedTrips().map(x=>`<div><strong>${esc(x.name)}</strong><div class="hint">${x.items.length} Gegenstände</div><div class="trip-actions"><button data-action="duplicate-trip" data-id="${esc(x.id)}">⧉ Als neue Reise verwenden</button><button data-action="unarchive-trip" data-id="${esc(x.id)}">Wiederherstellen</button><button data-action="delete-trip" data-id="${esc(x.id)}">Endgültig löschen</button></div></div>`).join('')}</div></details>`:''}${t?`<div class="learnpanel"><h3>Nach der Reise</h3><p class="hint">Notiere, was gefehlt hat. Packfolio schlägt dir diese Gegenstände bei der nächsten Reise wieder vor.</p><button class="inline-action" data-action="open-forgotten">＋ Was habe ich vergessen?</button>${(t.forgotten||[]).length?`<p class="hint">Schon notiert: ${t.forgotten.map(f=>esc(f.name)).join(' · ')}</p>`:''}</div>`:''}`}
function packing(){let t=active();if(!t)return header('AKTUELLE PACKLISTE')+`<div class="panel empty">Noch keine Reise ausgewählt.<div class="spacer"></div><button class="btn" data-action="new-trip">Reise anlegen</button></div>`;let p=progress(t),groups=t.items.reduce((a,i)=>((a[i.category||'Sonstiges']??=[]).push(i),a),{});let cats=[...new Set([...order,...Object.keys(groups)])].filter(c=>groups[c]?.length);return `<div class="top packtop"><div class="pack-actions"><button class="back-mini" data-action="go-home" aria-label="Zur Reiseübersicht">← Reisen</button></div><button class="round" data-action="pack-menu" aria-label="Weitere Optionen">⋯</button></div><h1 class="logo" style="margin-bottom:16px">${esc(t.name)}</h1><div class="packstatus"><span>${p.done} von ${p.total} eingepackt</span><span>${p.pct}%</span><div class="progress"><div style="width:${p.pct}%"></div></div></div>${(t.suggestions||[]).length?`<details class="panel" id="pf-suggestions" ${suggestionsOpen?'open':''}><summary><strong>Passende Ergänzungen</strong> <span class="hint">(optional)</span></summary><p class="hint">Auf Basis deiner Reiseeigenschaften – nichts wird ungefragt hinzugefügt.</p><div class="builder-tags">${t.suggestions.map(n=>{let added=t.items.some(i=>norm(canonicalName(i.name))===norm(canonicalName(n)));return `<button class="builder-tag" data-action="add-property-suggestion" data-name="${esc(n)}" aria-pressed="${added}" ${added?'disabled':''}>${added?'✓':'＋'} ${esc(n)}</button>`}).join('')}</div></details>`:''}<div class="category-stack">${cats.map(c=>{let arr=groups[c],count=arr.filter(i=>i.done).length,open=expanded.has(c);return `<section class="cat"><button class="cathead" data-action="toggle-cat" data-cat="${esc(c)}"><span class="cat-title">${esc(c)}</span><span class="cat-count">${count}/${arr.length} ${open?'⌃':'⌄'}</span></button>${open?`<div class="catbody">${arr.map(i=>`<div class="item ${i.done?'done':''}"><button class="item-delete" data-action="remove-item" data-id="${esc(i.id)}" aria-label="${esc(i.name)} von der Packliste entfernen" title="Entfernen">✕</button><div class="itemmain"><div class="itemname">${esc(i.name)}</div>${i.conditional?'<div class="itemmeta">Situativ</div>':''}</div><button class="quantity-pill" data-action="edit-qty" data-id="${esc(i.id)}" aria-label="Menge von ${esc(i.name)} ändern">${i.qty}×</button><input class="check" type="checkbox" data-action="check" data-id="${esc(i.id)}" aria-label="${esc(i.name)} eingepackt" ${i.done?'checked':''}></div>`).join('')}<div class="cat-add-row"><input class="cat-add-input" data-category="${esc(c)}" placeholder="＋ Gegenstand eingeben" aria-label="Gegenstand in ${esc(c)} hinzufügen"><button class="cat-add-plus" data-action="cat-picker" data-cat="${esc(c)}" aria-label="Lexikon für ${esc(c)} öffnen">＋</button></div><div class="cat-suggest" data-suggestions="${esc(c)}"></div></div>`:''}</section>`}).join('')}</div>${p.total===0?'<div class="panel empty">Noch keine Gegenstände. Über „Gegenstand ohne Kategorie hinzufügen“ kannst du starten.</div>':''}<div class="learnpanel review-compact"><button class="review-trigger" data-action="open-forgotten"><span>✎ &nbsp;Reiseerfahrungen</span><span>›</span></button>${(t.forgotten||[]).length?`<p class="hint">Notiert: ${t.forgotten.map(f=>esc(f.name)).join(' · ')}</p>`:''}</div>`}
function lexicon(){let items=allLexicon().filter(x=>x.kind!=='task'&&(showArchived||x.status!=='archiviert')&&(!lexQuery||norm(x.name).includes(norm(lexQuery))));return `<button class="back-mini" data-action="go-home">← Reisen</button><div class="spacer"></div>`+header('GEGENSTANDSLEXIKON')+`<div class="panel"><h2>Deine Gegenstände</h2><p class="muted">Aus deinen Packlisten und ergänzenden Anlass-Kategorien. Seltene Gegenstände bleiben situativ und werden nur auf Wunsch hinzugefügt.</p><div class="spacer"></div><input class="field" id="lex-search" placeholder="Gegenstand suchen …" value="${esc(lexQuery)}"><div class="spacer"></div><label class="hint"><input type="checkbox" id="archived" ${showArchived?'checked':''}> Archivierte Gegenstände anzeigen</label><div class="searchlist">${items.slice(0,120).map(x=>`<button class="searchresult" data-action="lex-add" data-name="${esc(x.name)}"><div class="line"><div><strong>${esc(x.name)}</strong><div class="hint">${esc(x.category)}</div></div><span>＋</span></div></button>`).join('')}</div>${items.length>120?'<div class="hint">Suche verwenden, um weitere Einträge zu finden.</div>':''}</div>`}
function renderPackingBehindModal(){if(tab==='packing')$('#app').innerHTML=packing()}
function render(){$('#app').innerHTML=tab==='home'?home():tab==='packing'?packing():lexicon();if(modal)renderModal()}
function openModal(type){modal=type;renderModal();requestAnimationFrame(updatePickerViewport)};function closeModal(){modal=null;$('#modal').innerHTML='';updatePickerViewport()}
function renderModal(){let body='';if(modal==='new'){body=`<h2>Neue Reise</h2><form id="new-form"><label for="trip-name">Name der Reise</label><input id="trip-name" class="field" required placeholder="z. B. Marokko 2027"><label for="trip-nights">Übernachtungen (optional)</label><input id="trip-nights" class="field" type="number" min="0" max="180" placeholder="z. B. 5"><label>Ausgangspunkt</label><div class="builder-tabs"><label><input type="radio" name="builder-source" value="templates" checked> Vorlagen</label><label><input type="radio" name="builder-source" value="past"> Frühere Reise</label><label><input type="radio" name="builder-source" value="empty"> Leer</label></div><div id="builder-templates"><details class="builder-group"><summary>Vorlagen auswählen (auch mehrere)</summary><p class="hint">Die bisherigen Vorlagen bleiben erhalten.</p>${BASE.templates.map((t,i)=>`<label class="templatechoice"><input type="checkbox" name="template" value="${i}"> ${esc(t.name)}</label>`).join('')}</details></div><div id="builder-past-group" hidden><label for="builder-past">Frühere oder archivierte Reise</label><select class="field" id="builder-past">${state.trips.map(t=>`<option value="${esc(t.id)}">${esc(t.name)}${t.archived?' (Archiv)':''}</option>`).join('')}</select><p class="hint">Mengen bleiben erhalten, Häkchen werden zurückgesetzt. Die alte Reise bleibt unverändert.</p></div><details class="builder-group" open><summary>Eigenschaften ergänzen</summary><div class="builder-tags">${PF_PROPERTIES.map(p=>`<label class="builder-tag"><input type="checkbox" data-property="${p.id}"> ${esc(p.label)}</label>`).join('')}</div></details>${forgottenSuggestions().length?`<details class="builder-group"><summary>Aus Vergessenem lernen</summary>${forgottenSuggestions().map(x=>`<label class="templatechoice"><input type="checkbox" name="remembered" value="${esc(x.name)}"> ${esc(x.name)} (${x.count}×)</label>`).join('')}</details>`:''}<div id="builder-preview" class="builder-tip" aria-live="polite"></div><div class="spacer"></div><button class="btn full" type="submit">Reise anlegen</button></form>`}else if(modal==='edit-trip'){let t=active();body=t?`<h2>Reise anpassen</h2><form id="edit-trip-form"><label for="edit-trip-name">Titel der Reise</label><input class="field" id="edit-trip-name" required value="${esc(t.name)}"><label for="edit-trip-start">Beginn (optional)</label><input class="field" type="date" id="edit-trip-start" value="${esc(t.startDate||'')}"><label for="edit-trip-end">Ende (optional)</label><input class="field" type="date" id="edit-trip-end" value="${esc(t.endDate||'')}"><label for="edit-trip-nights">Übernachtungen</label><input class="field" type="number" min="0" max="180" id="edit-trip-nights" value="${t.nights??''}"><label for="edit-trip-destination">Reiseziel (optional)</label><input class="field" id="edit-trip-destination" value="${esc(t.destination||'')}"><details class="builder-group" open><summary>Reiseeigenschaften ergänzen</summary><div class="builder-tags">${PF_PROPERTIES.map(p=>`<label class="builder-tag"><input type="checkbox" name="edit-property" value="${p.id}" ${(t.properties||[]).includes(p.id)?'checked':''}> ${esc(p.label)}</label>`).join('')}</div><p class="hint">Neue Eigenschaften ergänzen passende Gegenstände. Entfernte Eigenschaften löschen keine bestehenden Einträge.</p></details><details class="builder-group"><summary>Weitere Vorlagen ergänzen</summary>${BASE.templates.map((x,i)=>`<label class="templatechoice"><input type="checkbox" name="edit-template" value="${i}"> ${esc(x.name)}</label>`).join('')}</details><button class="btn full" type="submit">Änderungen übernehmen</button></form>`:''}else if(modal==='settings'){body=`<h2>Einstellungen & Daten</h2><p class="hint">Version <strong>1.5.1</strong></p><div class="spacer"></div><button class="btn full secondary" data-action="open-lexicon">Lexikon verwalten</button><p class="muted">Alle Daten liegen derzeit nur in diesem Safari-Browser. Sichere sie regelmäßig als JSON.</p><div class="spacer"></div><button class="btn full" data-action="export">Daten exportieren</button><div class="spacer"></div><label>Datensicherung importieren</label><input class="field" id="import-file" type="file" accept=".json,application/json"><div class="spacer"></div><div class="notice">Der Import ersetzt den aktuellen Stand. Vorher exportieren!</div><div class="spacer"></div><button class="btn full secondary" data-action="rename">Aktuelle Reise umbenennen</button><div class="spacer"></div><button class="btn full ghost" data-action="delete-trip">Aktuelle Reise löschen</button><div class="spacer"></div><p class="hint">Mikrofonaufnahme ist vorerst zurückgestellt. Du kannst weiterhin die Diktiertaste der iPhone-Tastatur verwenden.</p>`}else if(modal==='forgotten'){let t=active();body=`<h2>Was habe ich vergessen?</h2><p class="muted">${t?`Rückblick auf „${esc(t.name)}“`:'Reiserückblick'}. Diese Einträge zählen <strong>nicht</strong> als ungepackte Gegenstände und verändern den Packfortschritt nicht. Bei künftigen Reisen bekommst du sie als Vorschläge.</p><form id="forgotten-form"><label for="forgotten-text">Das hat gefehlt</label><textarea id="forgotten-text" class="field" rows="3" required placeholder="z. B. USB-Netzteil und Sonnenbrille"></textarea><p class="hint">Mehrere Gegenstände kannst du mit „und“ oder Komma trennen.</p><div class="spacer"></div><button class="btn full" type="submit">Erfahrung speichern</button></form>${(t?.forgotten||[]).length?`<h3 class="recent-title">Bei dieser Reise notiert</h3><div class="review-list">${t.forgotten.map(x=>`<div class="review-entry"><span>${esc(x.name)}</span><button class="inline-action danger" data-action="forget-undo" data-id="${esc(x.id)}" aria-label="Eintrag entfernen">Entfernen</button></div>`).join('')}</div>`:''}` }else if(modal==='add'){body=`<h2>Gegenstände hinzufügen</h2><p class="hint">Suchen, auswählen oder mehrere Gegenstände mit „und“ eingeben.</p><div class="addbar"><input id="quick" class="fiel  const layoutHeight=window.innerHeight;
 const visibleHeight=Math.max(180,Math.round(vv?.height||layoutHeight));
 const visibleTop=Math.max(0,Math.round(vv?.offsetTop||0));
 // iOS Safari changes the visual viewport when its keyboard appears.
 // Keep the backdrop covering the layout viewport and anchor the opaque
 // sheet above the keyboard. Never resize/move the backdrop itself.
 const keyboardInset=Math.max(0,Math.round(layoutHeight-visibleTop-visibleHeight));
 const keyboardOpen=keyboardInset>90;
 const sheetHeight=Math.max(160,Math.min(visibleHeight-4,keyboardOpen?visibleHeight-4:Math.round(visibleHeight*.76)));
 overlay.style.removeProperty('top');
 overlay.style.removeProperty('height');
 overlay.style.removeProperty('bottom');
 overlay.style.setProperty('--pf-keyboard-bottom',keyboardInset+'px');
 overlay.style.setProperty('--pf-picker-height',sheetHeight+'px');
}
let pickerViewportFrame=0;
function schedulePickerViewport(){
 if(pickerViewportFrame)cancelAnimationFrame(pickerViewportFrame);
 pickerViewportFrame=requestAnimationFrame(()=>{pickerViewportFrame=0;updatePickerViewport()});
}

let stickyFrame=0;
function refreshStickyHeaders(){
 stickyFrame=0;
 for(const h of document.querySelectorAll('.cathead')){
  const rect=h.getBoundingClientRect();const section=h.closest('.cat')?.getBoundingClientRect();
  h.classList.toggle('is-stuck',rect.top<=1&&section&&section.bottom>rect.height+2&&window.scrollY>5);
 }
}
window.addEventListener('scroll',()=>{if(!stickyFrame)stickyFrame=requestAnimationFrame(refreshStickyHeaders)},{passive:true});

if(window.visualViewport){visualViewport.addEventListener('resize',schedulePickerViewport);visualViewport.addEventListener('scroll',schedulePickerViewport)}
document.addEventListener('focusin',e=>{if(e.target?.id==='category-search'){schedulePickerViewport();requestAnimationFrame(schedulePickerViewport)}});
document.addEventListener('focusout',e=>{if(e.target?.id==='category-search'){schedulePickerViewport();requestAnimationFrame(schedulePickerViewport)}});
window.addEventListener('resize',schedulePickerViewport);
pfMigrate();render();updatePickerViewport();refreshStickyHeaders();
</script></body></html>
